# Somerset Little Eagle Football — Netlify build config (Astro).
# This file belongs to the redesign branch and is NOT applied to the live site
# until a cutover is approved. The live site is a plain static deploy of the old
# repo, and nothing here changes a Netlify setting.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin the Node major so a change to Netlify's default cannot silently break the build.
  NODE_VERSION = "22"

# --- Redirect map ------------------------------------------------------------
# This is the same list as public/_redirects, because a no-build deploy reads
# _redirects and a built deploy reads this file. tests/redirect-map-test.mjs
# asserts the two are identical, so they cannot drift.
#
# Every rule is forced (`force = true`): Netlify shadows an unforced rule when a
# real file exists at the same path, and the legacy `.html` files do exist.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Retired routes — About and Fields content is on the homepage now.
# The destination is `/`, NOT `/#about`: a fragment is only legal in this TOML file,
# and _redirects (which a no-build deploy reads) cannot express one at all — a
# quoted `"/#about"` is a parse error there and Netlify drops the rule, which is a
# 404 for a real visitor. The two copies are kept IDENTICAL on purpose (asserted by
# tests/redirect-map-test.mjs), so the fragment is expressed where it belongs: in the
# homepage navigation, not in the redirect map.
[[redirects]]
  from = "/pages/about.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pages/about"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pages/fields.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pages/fields"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/fields.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/fields"
  to = "/"
  status = 301
  force = true

# Form routes — same forms, top-level URLs.
[[redirects]]
  from = "/pages/register.html"
  to = "/register"
  status = 301
  force = true

[[redirects]]
  from = "/pages/register"
  to = "/register"
  status = 301
  force = true

[[redirects]]
  from = "/pages/physical.html"
  to = "/physical"
  status = 301
  force = true

[[redirects]]
  from = "/pages/physical"
  to = "/physical"
  status = 301
  force = true

[[redirects]]
  from = "/pages/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/pages/contact"
  to = "/contact"
  status = 301
  force = true

# The registration form navigates the browser here after a successful submit.
[[redirects]]
  from = "/pages/thankyou.html"
  to = "/thankyou"
  status = 301
  force = true

[[redirects]]
  from = "/pages/thankyou"
  to = "/thankyou"
  status = 301
  force = true

# --- Draft / branch deploys must never be indexed ---------------------------
# Netlify already sends `X-Robots-Tag: noindex` on branch deploys and Deploy
# Previews. When the deploy IS built by Netlify these contexts also bake the
# noindex meta tag (and a disallow-all robots.txt) into the HTML. The production
# context does not set this variable, so production output is unaffected.
[context.deploy-preview.environment]
  PUBLIC_NOINDEX = "true"

[context.branch-deploy.environment]
  PUBLIC_NOINDEX = "true"
